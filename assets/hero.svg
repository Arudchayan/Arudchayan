  <text x="46" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1" fill="#A79FC4">ZERAORA · RAYQUAZA · NOIVERN · METAGROSS · GENGAR · DECIDUEYE</text>

