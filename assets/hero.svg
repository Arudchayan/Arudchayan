    </radialGradient>
    <linearGradient id="hero-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <pattern id="hero-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="880" height="230" rx="20" fill="url(#hero-bg)"/>
  <rect width="880" height="230" rx="20" fill="url(#hero-grid)"/>
  <rect width="880" height="230" rx="20" fill="url(#hero-glow)"/>
  <rect width="880" height="230" rx="20" fill="url(#hero-teal)"/>
  <rect x="0.5" y="0.5" width="879" height="229" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <rect x="24" y="26" width="4" height="178" rx="2" fill="url(#hero-accent)"/>

  <text x="46" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="3.4" fill="#8B5CF6">BATTLEOPS // COMMAND CENTER</text>
  <text x="44" y="106" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="46" font-weight="800" letter-spacing="-1" fill="#F8F7FF">ARUDCHAYAN</text>
  <text x="46" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" letter-spacing="0.4" fill="#C9C4E0">ML research engineering · evals · reinforcement learning · reproducible systems</text>
