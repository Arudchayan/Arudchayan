    <text y="-2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="7.5" letter-spacing="1.4" fill="#6F6A88">POWER</text>
    <text y="19" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" font-weight="800" fill="#F8F7FF">79.7<tspan font-size="9" fill="#8B87A8">%</tspan></text>
