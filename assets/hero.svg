  <g transform="translate(46,208)">
    <circle cx="4" cy="-3" r="3" fill="#22D3EE"/>
    <text x="14" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5" letter-spacing="1.2" fill="#6F6A88">DAY 739943 · HARSH SUNLIGHT · 2026-11-23 · GITHUB.COM/ARUDCHAYAN</text>
