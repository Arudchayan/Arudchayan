name: Bug report
description: Report a reproducible defect in the engine, benchmark, or tooling.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. PokéLab is a deterministic benchmark, so the smallest reproduction with a seed is the fastest path to a fix.

        Do not use this form for security vulnerabilities. See `SECURITY.md` for private disclosure.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the defect.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact commands and the smallest input needed to reproduce the issue.
      placeholder: |
        python -m pokerl demo --seed 1
        1. ...
      render: shell
    validations:
      required: true

  - type: input
    id: seed
    attributes:
      label: Seed
      description: The seed used, if the issue involves simulation, training, or evaluation.
      placeholder: "1"

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Paste relevant output. Long logs may be attached as a file.
      render: shell

  - type: input
    id: version
    attributes:
      label: PokéLab version or commit
      placeholder: "1.0.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version and operating system.
      placeholder: "Python 3.12.4 on Ubuntu 24.04"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I provided a deterministic reproduction where possible.
          required: false
