name: Feature request
description: Propose a capability or improvement for PokéLab.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        PokéLab favors explicit scope, deterministic behavior, and zero runtime dependencies. Proposals that respect those constraints are easiest to review.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or gap does this feature address?
      placeholder: A benchmark user cannot currently...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, API, or workflow you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, simpler options, or related tools.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Engine and rules
        - Agents and policies
        - Evaluation and metrics
        - Training and experiments
        - CLI and tooling
        - Documentation
        - Packaging and CI
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Determinism and dependency impact
      description: How will this remain reproducible, and can it avoid new runtime dependencies?
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap before opening this request.
          required: true
        - label: I am willing to help implement or test this change.
          required: false
