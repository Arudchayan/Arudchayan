name: 🧪 Test README Build

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'README.template.md'
      - '.github/workflows/**'

jobs:
  test-build:
    name: 🧪 Test Pokémon Profile Generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚡ Test README Generation
        run: |
          echo "🧪 Testing README generation..."
          python3 scripts/build_readme.py
          echo "✅ Build script executed successfully!"
      
      - name: 📊 Validate Output
        run: |
          # A missing file also fails -s, so one check covers both
          [ -s README.md ] || { echo "❌ ERROR: README.md missing or empty!"; exit 1; }
          
          grep -q "Selected research" README.md || { echo "❌ ERROR: README.md missing Selected research section!"; exit 1; }
          grep -q "Field notes" README.md || { echo "❌ ERROR: README.md missing Field notes section!"; exit 1; }
          ! grep -qE '\{[A-Z_]+\}' README.md || { echo "❌ ERROR: README.md has unresolved placeholders!"; exit 1; }
          
          for asset in $(grep -oE 'assets/[A-Za-z0-9_./-]+\.svg' README.md | sort -u); do
            [ -f "$asset" ] || { echo "❌ ERROR: missing $asset"; exit 1; }
          done
          
          echo "✅ README.md validation passed!"
          echo "📏 File size: $(wc -c < README.md) bytes"
          echo "📄 Line count: $(wc -l < README.md) lines"

