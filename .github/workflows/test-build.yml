name: 🧪 Test README Build

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'README.template.md'
      - '.github/workflows/**'

jobs:
  test-build:
    name: 🧪 Test Pokémon Profile Generation
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: ⚡ Test README Generation
        run: |
          echo "🧪 Testing README generation..."
          python3 scripts/build_readme.py
          echo "✅ Build script executed successfully!"
      
      - name: 📊 Validate Output
        run: |
          # A missing file also fails -s, so one check covers both
          [ -s README.md ] || { echo "❌ ERROR: README.md missing or empty!"; exit 1; }
          
          grep -q -e "POKÉMON TRAINER PROFILE" -e "TEAM CONFIGURATION" README.md || { echo "❌ ERROR: README.md missing required sections!"; exit 1; }
          
          echo "✅ README.md validation passed!"
          echo "📏 File size: $(wc -c < README.md) bytes"
          echo "📄 Line count: $(wc -l < README.md) lines"

