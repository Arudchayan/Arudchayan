name: 🎮 Update Pokémon Trainer Profile

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  
  # Run on push to main/master branch
  push:
    branches:
      - main
      - master
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'README.template.md'
      - '.github/workflows/update-readme.yml'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-readme:
    name: 🔄 Generate Bonkers Pokémon README
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: ⚡ Generate README with PokéAPI Data
        run: |
          echo "🎯 Starting Pokémon Trainer Profile Generation..."
          python3 scripts/build_readme.py
          echo "✅ README Generated Successfully!"
      
      - name: 📊 Check for Changes
        id: check_changes
        run: |
          if git diff --quiet README.md assets/ data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in README.md or assets."
          fi
      
      - name: 💾 Commit and Push Changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "Pokémon Trainer Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Get current archetype info
          ARCHETYPE=$(grep -A 1 "CURRENT_ARCHETYPE_START" README.md | grep "Archetype:" | sed 's/.*Archetype: \*\*//; s/\*\*.*//')
          
          git add README.md assets/ data/
          git commit -m "$(cat <<EOF | sed 's/^[[:space:]]*//'
          🎮 Daily Pokémon Profile Update

          ✨ Archetype: ${ARCHETYPE}
          🤖 Auto-generated by GitHub Actions
          ⚡ Gotta Code 'Em All!

          [skip ci]
          EOF
          )"
          
          git push
      
      - name: 🎉 Success!
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎮 Pokémon Trainer Profile Updated!"
          echo "⚡ README.md has been regenerated!"
          echo "💜 GOTTA CODE 'EM ALL!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      - name: 😴 No Changes
        if: steps.check_changes.outputs.changed == 'false'
        run: |
          echo "ℹ️  No changes needed - README is up to date!"
