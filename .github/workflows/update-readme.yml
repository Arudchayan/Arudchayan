name: 🎮 Update Pokémon Trainer Profile

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  
  # Run on push to main/master branch
  push:
    branches:
      - main
      - master
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'README.template.md'
      - '.github/workflows/update-readme.yml'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-readme:
    name: 🔄 Generate Bonkers Pokémon README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: profile-readme-write
      cancel-in-progress: false
    
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚡ Generate README with PokéAPI Data
        run: |
          echo "🎯 Starting Pokémon Trainer Profile Generation..."
          python3 scripts/build_readme.py
          echo "✅ README Generated Successfully!"
      
      - name: 💾 Commit and Push Changes
        run: |
          git config user.name "Pokémon Trainer Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md assets/ data/
          if ! git diff --cached --quiet; then
            git commit -m "🎮 Daily Pokémon Profile Update [skip ci]"
            git push
          fi

