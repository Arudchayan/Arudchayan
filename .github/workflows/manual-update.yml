name: 🎯 Manual README Update

on:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force regenerate even if no changes'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  manual-update:
    name: 🎮 Manual Pokémon Profile Update
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: ⚡ Generate README with Fresh Pokémon Data
        run: |
          echo "🎯 Manually Triggered README Generation!"
          python3 scripts/build_readme.py
          echo "✅ README Generated!"
      
      - name: 📊 Show Changes
        run: |
          echo "📝 Changes made to README.md:"
          git diff README.md || echo "No changes"
      
      - name: 💾 Commit and Push
        run: |
          git config user.name "Pokémon Trainer Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes
          if git diff --quiet README.md; then
            if [ "${{ inputs.force_regenerate }}" == "true" ]; then
              echo "Forcing commit despite no changes..."
              git add README.md
              git commit --allow-empty -m "$(cat <<EOF | sed 's/^[[:space:]]*//'
              🔄 Manual Profile Refresh

              🎮 Force regenerated by manual trigger
              ⚡ Gotta Code 'Em All!

              [skip ci]
              EOF
              )"
              git push
            else
              echo "No changes detected and force_regenerate is false. Skipping commit."
            fi
          else
            ARCHETYPE=$(grep -A 1 "CURRENT_ARCHETYPE_START" README.md | grep "Archetype:" | sed 's/.*Archetype: \*\*//; s/\*\*.*//')
            
            git add README.md
            git commit -m "$(cat <<EOF | sed 's/^[[:space:]]*//'
            🎮 Manual Pokémon Profile Update

            ✨ Archetype: ${ARCHETYPE}
            👤 Manually triggered by user
            ⚡ Gotta Code 'Em All!

            [skip ci]
            EOF
            )"
            git push
          fi
      
      - name: 🎉 Complete!
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎮 Manual Update Complete!"
          echo "✨ Check your GitHub profile!"
          echo "💜 GOTTA CODE 'EM ALL!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
