name: Benchmark

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      games:
        description: "Games per agent pair"
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  benchmark:
    name: Reproducible benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run benchmark
        env:
          GAMES: ${{ github.event.inputs.games || '60' }}
        run: |
          python -m pokerl bench --games "$GAMES" --seed 2025
          python -m pokerl generalize --games "$GAMES" --seed 2025
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pokerl-results
          path: |
            results/
            docs/assets/
            docs/dispatch.json
          if-no-files-found: error
